[build-system]
requires = ["setuptools==75.1.0", "wheel==0.44.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-docparser"
description = "Enterprise document parsing and RAG ingestion platform"
readme = "README.md"
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
  "pypdf==6.16.2",
  "pydantic==2.8.2",
  "PyYAML==6.0.1",
  "typer==0.26.8",
]

[project.optional-dependencies]
docling = [
  "docling==2.123.0",
]
paddleocr-vl = [
  "paddleocr[doc-parser]==3.7.0",
  "paddlex[ocr,genai-client]==3.7.1",
]
dev = [
  "hypothesis==6.165.10",
  "jsonschema==4.26.0",
  "mypy==1.11.2",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.15.20",
  "types-jsonschema==4.26.0.20260518",
  "types-PyYAML==6.0.12.20260815",
]

[project.scripts]
docparser = "docparser.cli.main:app"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "docparser.version.__version__" }

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["docling.*", "paddleocr.*", "paddle.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q -m 'not network and not gpu and not parser' --cov=docparser.ir --cov=docparser.quality --cov=docparser.fallback --cov=docparser.application.robust --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
markers = [
  "gpu: requires a local GPU and model runtime",
  "integration: exercises an installed external parser runtime",
  "network: requires external network access",
  "parser: requires the pinned optional parser dependency and model artifacts",
]

[tool.coverage.run]
branch = true
source = [
  "docparser.application.robust",
  "docparser.fallback",
  "docparser.ir",
  "docparser.quality",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
